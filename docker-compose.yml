services:
  web:
    image: andoerga/andoergaukpb-web:apache

    container_name: andoergaukpb-web

    ports:
      - "8081:80"

    env_file:
      - ../.env

    volumes:
      - ./:/var/www/html
      - ../_setting.json:/_setting.json
      - C:/xampp/htdocs/andoergaukpb-storage/assets:/var/www/html/assets
      - C:/xampp/htdocs/andoergaukpb-storage/uploads:/var/www/html/uploads
      - ../.env:/var/www/html/.env

    restart: unless-stopped